name: DSM-ES Validator V2 — offline PDF DOCX HTML preflight

on:
  pull_request:
    paths:
      - 'validator/preflight_v2.py'
      - 'validator/file_cli.py'
      - 'requirements-validator-v2.txt'
      - 'tests/test_preflight_v2.py'
      - 'validator/README.md'
      - '.github/workflows/preflight-v2.yml'
  push:
    branches: [main]
    paths:
      - 'validator/preflight_v2.py'
      - 'validator/file_cli.py'
      - 'requirements-validator-v2.txt'
      - 'tests/test_preflight_v2.py'
      - 'validator/README.md'
      - '.github/workflows/preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional local PDF/DOCX parsers
        run: python -m pip install -r requirements-validator-v2.txt
      - name: Synthetic PDF DOCX HTML test suite
        run: python -m unittest discover -s tests -p 'test_preflight_v2.py' -v
      - name: Ensure V1 tests still pass
        run: python -m unittest discover -s tests -p 'test_validator_v1.py' -v
